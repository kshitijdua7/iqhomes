# One-click public demo on Render (render.com → New → Blueprint → pick this repo).
# Runs in demo mode (one-tap logins, resets every hour) and saves to a Render PostgreSQL database.
services:
  - type: web
    name: iqhomes-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: DEMO_RESET_MIN
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: iqhomes-db
          property: connectionString
      # Optional: set in the Render dashboard to turn on Nova's AI brain.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: iqhomes-db
    plan: free
